name: happy-commit
on:
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  happy:
    uses: kitsuyui/gh-actions-workflows/.github/workflows/happy-commit.yml@3a3ec24ddcb7c3db65245357b7585392be01f65c
